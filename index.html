<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INKBOUND — a journal of the road not yet taken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #241d14;
    --ink-soft: #46392a;
    --parchment: #e9dcc0;
    --parchment-dark: #d9c69c;
    --parchment-shadow: #b8a172;
    --night: #1b1f30;
    --night-deep: #11131e;
    --wax: #8b2635;
    --wax-dark: #6c1c28;
    --brass: #c9a24b;
    --brass-soft: #a9853a;
    --sage: #5c7a5e;
    --danger: #a83232;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse 900px 600px at 50% 18%, rgba(201,162,75,0.10), transparent 60%),
      radial-gradient(ellipse 1200px 900px at 50% 100%, rgba(139,38,53,0.08), transparent 55%),
      var(--night);
    background-color: var(--night);
    color: var(--parchment);
    font-family: 'Courier Prime', monospace;
    display:flex;
    justify-content:center;
    padding: 32px 16px 64px;
    animation: settle-in 700ms ease-out;
  }
  @keyframes settle-in{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  #app{ width:100%; max-width: 720px; }

  /* ---------- header ---------- */
  header.masthead{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom: 6px;
    color: var(--brass);
  }
  header.masthead h1{
    font-family: 'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 2.1rem;
    letter-spacing: 0.14em;
    margin:0;
    color: var(--parchment);
  }
  .tagline{
    text-align:center;
    font-style: italic;
    font-family: 'Cormorant Garamond', serif;
    color: var(--brass);
    opacity:0.85;
    margin: 0 0 28px;
    font-size: 1.05rem;
  }

  /* ---------- stat bar ---------- */
  .statbar{
    display:flex;
    align-items:center;
    gap: 22px;
    flex-wrap: wrap;
    justify-content:center;
    background: rgba(233,220,192,0.06);
    border: 1px solid rgba(201,162,75,0.25);
    border-radius: 3px;
    padding: 10px 18px;
    margin-bottom: 22px;
    font-size: 0.78rem;
  }
  .stat-label{ color: var(--brass); margin-right:6px; }
  .vitality-wrap{ display:flex; align-items:center; gap:8px; }
  .vitality-track{
    width: 110px; height: 8px;
    background: rgba(0,0,0,0.35);
    border:1px solid rgba(201,162,75,0.35);
    border-radius: 2px;
    overflow:hidden;
  }
  .vitality-fill{
    height:100%;
    background: linear-gradient(90deg, var(--wax), var(--brass));
    transition: width 500ms ease;
  }
  .flame{ color: var(--brass); flex-shrink:0; }
  .satchel-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .chip{
    border:1px solid rgba(201,162,75,0.4);
    padding: 2px 8px;
    border-radius: 2px;
    color: var(--parchment);
    background: rgba(0,0,0,0.15);
  }
  .chip.empty{ opacity:0.5; font-style:italic; }
  .entry-count{ margin-left:auto; color: var(--brass); }

  /* ---------- ledger card ---------- */
  .ledger-stack{ position:relative; }
  .ledger-stack::before{
    content:"";
    position:absolute;
    inset: 10px -8px -12px 8px;
    background: var(--parchment-shadow);
    border-radius: 2px;
    transform: rotate(1.1deg);
    z-index:0;
  }
  .ledger{
    position:relative;
    z-index:1;
    background:
      radial-gradient(circle at 10% 15%, rgba(184,161,114,0.35), transparent 40%),
      radial-gradient(circle at 90% 85%, rgba(184,161,114,0.3), transparent 45%),
      radial-gradient(circle at 60% 40%, rgba(184,161,114,0.18), transparent 55%),
      var(--parchment);
    color: var(--ink);
    border-radius: 2px;
    padding: 34px 34px 28px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.45);
    transform: rotate(-0.4deg);
  }
  @media (max-width: 560px){
    .ledger{ padding: 24px 20px 22px; }
  }

  .entry-enter{ animation: fade-up 450ms ease-out; }
  @keyframes fade-up{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .narrative{
    font-family:'Cormorant Garamond', serif;
    font-size: 1.28rem;
    line-height: 1.7;
    max-width: 64ch;
    margin: 0 auto;
  }
  .narrative p{ margin: 0 0 1em; }
  .narrative p:first-of-type::first-letter{
    font-size: 3.1em;
    line-height: 0.75;
    float:left;
    padding: 4px 8px 0 0;
    color: var(--wax);
    font-weight:600;
  }

  .fold{
    border:none;
    border-top: 1px dashed var(--parchment-shadow);
    margin: 24px 0 20px;
  }

  .choices{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
  }
  .choice-btn{
    font-family:'Courier Prime', monospace;
    font-size: 0.86rem;
    background: var(--parchment-dark);
    border: 1px solid var(--parchment-shadow);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: 2px;
    cursor:pointer;
    text-align:left;
    line-height:1.35;
    transition: background 150ms ease, border-color 150ms ease;
  }
  .choice-btn:hover, .choice-btn:focus-visible{
    background: var(--parchment);
    border-color: var(--wax);
    outline: none;
  }
  .choice-btn:active{ transform: translateY(1px); }

  .custom-row{
    margin-top: 18px;
    display:flex;
    gap:8px;
    align-items:center;
    border-top: 1px solid var(--parchment-shadow);
    padding-top: 16px;
  }
  .custom-row input[type="text"]{
    flex:1;
    font-family:'Courier Prime', monospace;
    font-size: 0.85rem;
    background: transparent;
    border:none;
    border-bottom: 1px solid var(--ink-soft);
    color: var(--ink);
    padding: 6px 2px;
  }
  .custom-row input[type="text"]:focus{
    outline:none;
    border-bottom-color: var(--wax);
  }
  .icon-btn{
    background: none;
    border: 1px solid var(--ink-soft);
    color: var(--ink);
    width: 34px; height:34px;
    border-radius: 2px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover, .icon-btn:focus-visible{ border-color: var(--wax); color: var(--wax); outline:none; }

  .abandon-link{
    display:block;
    text-align:center;
    margin-top: 22px;
    font-size: 0.72rem;
    color: var(--ink-soft);
    background:none;
    border:none;
    text-decoration: underline;
    cursor:pointer;
    font-family:'Courier Prime', monospace;
  }

  /* ---------- setup screen ---------- */
  .field{ margin-bottom: 22px; }
  .field label{
    display:block;
    font-size: 0.78rem;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .field input[type="text"], .field input[type="password"], .field textarea{
    width:100%;
    font-family:'Courier Prime', monospace;
    font-size: 0.92rem;
    background: transparent;
    border:none;
    border-bottom: 1px solid var(--ink-soft);
    color: var(--ink);
    padding: 8px 2px;
    resize: none;
  }
  .field input[type="text"]:focus, .field input[type="password"]:focus, .field textarea:focus{
    outline:none;
    border-bottom-color: var(--wax);
  }
  .field-note{
    font-size: 0.68rem;
    color: var(--ink-soft);
    margin: 6px 0 0;
    line-height: 1.4;
  }
  .field-note a{ color: var(--wax); }

  .archetypes{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 26px;
  }
  @media (max-width: 480px){ .archetypes{ grid-template-columns: 1fr; } }

  .archetype-card{
    text-align:left;
    background: rgba(0,0,0,0.03);
    border: 1px solid var(--parchment-shadow);
    border-radius: 2px;
    padding: 14px;
    cursor:pointer;
    display:flex;
    gap:12px;
    align-items:flex-start;
    color: var(--ink);
    font-family:'Courier Prime', monospace;
  }
  .archetype-card:hover, .archetype-card:focus-visible{ border-color: var(--wax); outline:none; }
  .archetype-card.selected{
    border-color: var(--wax);
    background: rgba(139,38,53,0.07);
  }
  .archetype-card .a-icon{ color: var(--wax); flex-shrink:0; margin-top:2px; }
  .archetype-card .a-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 1.08rem;
    margin: 0 0 4px;
  }
  .archetype-card .a-desc{ font-size: 0.76rem; color: var(--ink-soft); line-height:1.4; }

  .begin-row{ display:flex; flex-direction:column; align-items:center; gap:10px; margin-top: 8px; }
  .seal-btn{
    width: 96px; height: 96px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--wax) 0%, var(--wax-dark) 70%);
    color: var(--parchment);
    border: 2px solid rgba(0,0,0,0.25);
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    cursor:pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.35), inset 0 2px 3px rgba(255,255,255,0.15);
    transition: transform 120ms ease;
  }
  .seal-btn:disabled{ opacity: 0.4; cursor:not-allowed; }
  .seal-btn:not(:disabled):active{ transform: scale(0.93); }
  .setup-hint{ font-size:0.72rem; color: var(--ink-soft); min-height: 1em; }

  /* ---------- loading / error ---------- */
  .loading-row{
    display:flex; align-items:center; gap:10px;
    justify-content:center;
    color: var(--ink-soft);
    font-size: 0.85rem;
    font-style: italic;
    font-family:'Cormorant Garamond', serif;
    padding: 10px 0 4px;
  }
  .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--wax);
    animation: pulse-dot 1.1s ease-in-out infinite;
  }
  .dot:nth-child(2){ animation-delay: 0.15s; }
  .dot:nth-child(3){ animation-delay: 0.3s; }
  @keyframes pulse-dot{
    0%, 80%, 100%{ opacity:0.25; transform: scale(0.8); }
    40%{ opacity:1; transform: scale(1); }
  }

  .error-box{
    text-align:center;
    color: var(--danger);
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 1rem;
    margin-bottom: 14px;
  }
  .retry-btn{
    display:block;
    margin: 8px auto 0;
    font-family:'Courier Prime', monospace;
    font-size: 0.78rem;
    background: var(--parchment-dark);
    border: 1px solid var(--wax);
    color: var(--ink);
    padding: 8px 14px;
    border-radius: 2px;
    cursor:pointer;
  }

  /* ---------- end screen ---------- */
  .fate-badge{
    display:inline-block;
    font-family:'Courier Prime', monospace;
    font-size: 0.72rem;
    border: 1px solid var(--wax);
    color: var(--wax);
    padding: 3px 10px;
    border-radius: 2px;
    margin-bottom: 16px;
  }
  .end-stats{
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid var(--parchment-shadow);
    font-size: 0.82rem;
    color: var(--ink-soft);
    display:flex;
    gap: 22px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .new-tale-row{ display:flex; justify-content:center; margin-top: 26px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  /* ---------------- content data ---------------- */

  const ICONS = {
    compass: '<svg viewBox="0 0 64 64" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="32" cy="32" r="25"/><path d="M32 10 L36 30 L32 33 L28 30 Z" fill="currentColor" stroke="none"/><path d="M32 54 L28 34 L32 31 L36 34 Z" fill="currentColor" stroke="none" opacity="0.45"/><line x1="32" y1="15" x2="32" y2="21"/><line x1="32" y1="43" x2="32" y2="49"/><line x1="15" y1="32" x2="21" y2="32"/><line x1="43" y1="32" x2="49" y2="32"/></svg>',
    flame: '<svg viewBox="0 0 16 20" width="13" height="16" fill="currentColor"><path d="M8 0 C8 5 3 6 3 11 a5 5 0 0 0 10 0 C13 6 8 5 8 0 Z"/></svg>',
    quill: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 4 C14 6 8 12 5 19 l-1 2 2-1 c7-3 13-9 15-15 Z" stroke-linejoin="round"/><line x1="9" y1="15" x2="5" y2="19"/></svg>',
    map: '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7 L10 5 L18 7 L24 5 L24 21 L18 23 L10 21 L4 23 Z" stroke-linejoin="round"/><line x1="10" y1="5" x2="10" y2="21"/><line x1="18" y1="7" x2="18" y2="23"/></svg>',
    coin: '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="14" cy="14" r="9"/><path d="M14 9 v10 M11 11.5 q0 -2.5 3 -2.5 t3 2.5 q0 2 -3 2.5 q-3 0.5 -3 2.5 t3 2.5 t3 -2.5"/></svg>',
    blade: '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><line x1="8" y1="21" x2="17" y2="11"/><line x1="17" y1="11" x2="14" y2="8"/><line x1="19" y1="13" x2="22" y2="10"/><line x1="6" y1="23" x2="8" y2="21"/><line x1="10" y1="6" x2="13" y2="9"/><line x1="15" y1="4" x2="18" y2="7"/></svg>',
    flask: '<svg viewBox="0 0 28 28" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4 h6 M12 4 v7 l-6 11 a2 2 0 0 0 2 3 h12 a2 2 0 0 0 2 -3 l-6 -11 v-7"/><line x1="8.5" y1="18" x2="19.5" y2="18"/></svg>'
  };

  const ARCHETYPES = [
    { id:'cartographer', name:'The Cartographer', article:'a', desc:"Draws maps of places that shouldn't exist yet.", icon: ICONS.map },
    { id:'smuggler', name:'The Smuggler', article:'a', desc:'Owes the wrong people a debt paid in secrets.', icon: ICONS.coin },
    { id:'knight', name:'The Exiled Knight', article:'an', desc:'Cast out from an order sworn to protect a lie.', icon: ICONS.blade },
    { id:'alchemist', name:'The Alchemist', article:'an', desc:'Chases a formula that vanished with its inventor.', icon: ICONS.flask }
  ];

  const SYSTEM_PROMPT = `You are the narrator for INKBOUND, a literary text-adventure told as journal entries. Voice: vivid, sensory, second person ("You..."), evocative but concise. Tone: adventurous and atmospheric, occasionally perilous, suitable for a general audience (no graphic violence or gore, no sexual content). Plain prose only — never use markdown formatting (no asterisks, no headers, no numbered lists) inside narrative or choice text.

You will be given the character's identity, current vitality (0-100), satchel contents, a running story summary, and the player's latest action. Continue the tale:
- Narrative: exactly 2-3 short paragraphs (140-220 words total) describing what happens as a result of the player's action, with meaningful consequences, discoveries, obstacles, or characters.
- Then invent exactly 3 distinct, specific, action-oriented choices for what the player could do next (each under 12 words, no numbering, no leading dash).
- vitalityChange: a small integer, usually 0. Reckless or dangerous turns may reduce it (-5 to -25). Rest, aid, or clever play may restore it (+5 to +15). Reaching 0 means death.
- itemsGained / itemsLost: only when narratively justified, plain short item names, usually empty arrays.
- summary: one past-tense sentence capturing this turn, for the running record.
- gameOver: true only when the tale reaches a satisfying dramatic conclusion (victory, defeat, or bittersweet ending) — typically after 8 to 14 entries, never on the first few turns unless vitality hits 0.
- epilogue: when gameOver is true, 2-3 closing sentences; otherwise null.

Respond with ONLY minified JSON, no markdown code fences, no commentary, in exactly this shape:
{"narrative":"...","choices":["...","...","..."],"vitalityChange":0,"itemsGained":[],"itemsLost":[],"summary":"...","gameOver":false,"gameOverReason":null,"epilogue":null}`;

  /* ---------------- state ---------------- */

  const state = {
    screen: 'setup',
    apiKey: '',
    model: 'openai/gpt-oss-120b',
    name: '',
    archetype: null,
    customSeed: '',
    vitality: 100,
    satchel: [],
    turn: 0,
    summaries: [],
    narrative: '',
    choices: [],
    loading: false,
    error: null,
    lastAction: null,
    epilogue: '',
    fate: null,
    firstLoad: true
  };

  function esc(str){
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  /* ---------------- API ---------------- */

  function buildOpeningPrompt(){
    const seed = state.customSeed.trim();
    return `Character: ${state.name}, ${state.archetype.article} ${state.archetype.name} — ${state.archetype.desc} Vitality: 100/100. Satchel: empty. This is the opening entry of the tale.${seed ? ' The chronicler wishes their tale to involve: ' + seed + '.' : ''} Player's action: "BEGIN THE TALE — set the opening scene and hook."`;
  }

  function buildTurnPrompt(actionText){
    const satchelStr = state.satchel.length ? state.satchel.join(', ') : 'empty';
    const storySoFar = state.summaries.join(' ');
    return `Character: ${state.name}, ${state.archetype.article} ${state.archetype.name}. Vitality: ${state.vitality}/100. Satchel: ${satchelStr}. Entry number: ${state.turn}. Story so far: ${storySoFar} Player's action: "${actionText}".`;
  }

  async function callDM(actionText){
    state.loading = true;
    state.error = null;
    state.lastAction = actionText;
    render();

    const userMsg = state.turn === 0 ? buildOpeningPrompt() : buildTurnPrompt(actionText);

    try{
      const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + state.apiKey.trim()
        },
        body: JSON.stringify({
          model: state.model.trim() || 'openai/gpt-oss-120b',
          max_tokens: 1000,
          response_format: { type: 'json_object' },
          reasoning_format: 'hidden',
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: userMsg }
          ]
        })
      });
      if(!response.ok){
        if(response.status === 401) throw new Error('Groq rejected the API key (401). Check that it was copied correctly.');
        if(response.status === 404) throw new Error('Groq could not find that model (404). Check the model name.');
        throw new Error('Groq request failed with status ' + response.status);
      }
      const data = await response.json();
      const messageContent = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
      if(!messageContent) throw new Error('No narrative returned');
      let raw = messageContent.trim();
      raw = raw.replace(/^```json/i, '').replace(/^```/, '').replace(/```$/, '').trim();
      const firstBrace = raw.indexOf('{');
      const lastBrace = raw.lastIndexOf('}');
      if(firstBrace >= 0 && lastBrace > firstBrace) raw = raw.slice(firstBrace, lastBrace + 1);
      const parsed = JSON.parse(raw);
      applyTurn(parsed);
    }catch(err){
      console.error(err);
      state.loading = false;
      state.error = err && err.message && /Groq/.test(err.message)
        ? err.message
        : "The ink has smudged and the words won't settle. Perhaps try again.";
      render();
    }
  }

  function applyTurn(parsed){
    const narrative = typeof parsed.narrative === 'string' ? parsed.narrative : '';
    const choices = Array.isArray(parsed.choices) ? parsed.choices.filter(c => typeof c === 'string' && c.trim()).slice(0,4) : [];
    const vitalityChange = Number.isFinite(parsed.vitalityChange) ? parsed.vitalityChange : 0;
    const itemsGained = Array.isArray(parsed.itemsGained) ? parsed.itemsGained.filter(i => typeof i === 'string' && i.trim()) : [];
    const itemsLost = Array.isArray(parsed.itemsLost) ? parsed.itemsLost.filter(i => typeof i === 'string' && i.trim()) : [];
    const summary = typeof parsed.summary === 'string' && parsed.summary.trim() ? parsed.summary.trim() : narrative.slice(0,140);
    const gameOver = !!parsed.gameOver;
    const gameOverReason = typeof parsed.gameOverReason === 'string' ? parsed.gameOverReason : null;
    const epilogue = typeof parsed.epilogue === 'string' ? parsed.epilogue : '';

    state.vitality = Math.max(0, Math.min(100, state.vitality + vitalityChange));
    itemsGained.forEach(i => { if(!state.satchel.includes(i)) state.satchel.push(i); });
    itemsLost.forEach(i => { state.satchel = state.satchel.filter(x => x !== i); });
    state.turn += 1;
    state.narrative = narrative;
    state.choices = choices;
    if(summary) state.summaries.push(summary);
    state.loading = false;
    state.error = null;
    state.screen = 'story';

    if(gameOver || state.vitality <= 0){
      state.screen = 'end';
      state.fate = state.vitality <= 0 ? 'death' : (gameOverReason || 'conclusion');
      state.epilogue = epilogue || (state.vitality <= 0
        ? 'The candle gutters out. Your tale ends here, in ink and shadow.'
        : 'And so the tale draws to its close.');
    }
    render();
  }

  /* ---------------- actions ---------------- */

  function selectArchetype(id){
    state.archetype = ARCHETYPES.find(a => a.id === id) || null;
    render();
  }

  function beginTale(){
    if(!state.name.trim() || !state.archetype || !state.apiKey.trim()) return;
    callDM(null);
  }

  function chooseChoice(index){
    if(state.loading) return;
    const text = state.choices[index];
    if(!text) return;
    callDM(text);
  }

  function submitCustom(){
    if(state.loading) return;
    const input = document.getElementById('custom-action-input');
    if(!input) return;
    const val = input.value.trim();
    if(!val) return;
    input.value = '';
    callDM(val);
  }

  function retry(){
    callDM(state.lastAction);
  }

  function resetGame(){
    state.screen = 'setup';
    state.name = '';
    state.archetype = null;
    state.customSeed = '';
    state.vitality = 100;
    state.satchel = [];
    state.turn = 0;
    state.summaries = [];
    state.narrative = '';
    state.choices = [];
    state.loading = false;
    state.error = null;
    state.lastAction = null;
    state.epilogue = '';
    state.fate = null;
    render();
  }

  function abandonTale(){
    if(confirm('Abandon this tale and begin a new one?')) resetGame();
  }

  /* ---------------- render ---------------- */

  function render(){
    const app = document.getElementById('app');
    app.innerHTML =
      renderHeader() +
      (state.screen === 'setup' ? renderSetup() :
       state.screen === 'story' ? renderStatBar() + renderStory() :
       renderStatBar() + renderEnd());
    attachHandlers();
  }

  function renderHeader(){
    return `
      <header class="masthead">${ICONS.compass}<h1>INKBOUND</h1></header>
      <p class="tagline">a journal of the road not yet taken</p>
    `;
  }

  function renderStatBar(){
    const satchelHtml = state.satchel.length
      ? state.satchel.map(i => `<span class="chip">${esc(i)}</span>`).join('')
      : `<span class="chip empty">satchel empty</span>`;
    return `
      <div class="statbar">
        <div class="vitality-wrap">
          <span class="stat-label">Vitality</span>
          <div class="vitality-track"><div class="vitality-fill" style="width:${state.vitality}%"></div></div>
          <span class="flame">${ICONS.flame}</span>
        </div>
        <div class="satchel-row">${satchelHtml}</div>
        <span class="entry-count">Entry No. ${state.turn}</span>
      </div>
    `;
  }

  function renderSetup(){
    const archetypeCards = ARCHETYPES.map(a => `
      <button type="button" class="archetype-card ${state.archetype && state.archetype.id === a.id ? 'selected' : ''}" data-action="select-archetype" data-id="${a.id}">
        <span class="a-icon">${a.icon}</span>
        <span>
          <span class="a-name">${a.name}</span><br/>
          <span class="a-desc">${esc(a.desc)}</span>
        </span>
      </button>
    `).join('');

    const canBegin = state.name.trim() && state.archetype && state.apiKey.trim() && !state.loading;

    return `
      <div class="ledger-stack">
        <div class="ledger">
          <div class="field">
            <label for="apikey-input">Groq API key</label>
            <input type="password" id="apikey-input" autocomplete="off" spellcheck="false" placeholder="gsk_..." value="${esc(state.apiKey)}" />
            <p class="field-note">Stays in your browser for this session only, sent straight to Groq. Free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.</p>
          </div>
          <div class="field">
            <label for="model-input">Groq model</label>
            <input type="text" id="model-input" maxlength="60" placeholder="openai/gpt-oss-120b" value="${esc(state.model)}" />
          </div>
          <div class="field">
            <label for="name-input">Your name, for the record</label>
            <input type="text" id="name-input" maxlength="30" placeholder="e.g. Rosalind Vey" value="${esc(state.name)}" />
          </div>
          <div class="field">
            <label>Choose who you are</label>
            <div class="archetypes">${archetypeCards}</div>
          </div>
          <div class="field">
            <label for="seed-input">Whisper a detail into the wind (optional)</label>
            <textarea id="seed-input" rows="2" maxlength="140" placeholder="e.g. a lighthouse that shouldn't still be lit">${esc(state.customSeed)}</textarea>
          </div>
          ${state.loading ? renderLoading() : ''}
          ${state.error ? `<div class="error-box">${esc(state.error)}</div><button class="retry-btn" data-action="retry" type="button">Try again</button>` : ''}
          <div class="begin-row">
            <button type="button" class="seal-btn" data-action="begin" ${canBegin ? '' : 'disabled'}>Begin<br/>Your Tale</button>
            <span class="setup-hint">${canBegin ? '' : 'Add your Groq API key, name yourself, and choose your path'}</span>
          </div>
        </div>
      </div>
    `;
  }

  function renderStory(){
    const paragraphs = state.narrative.split(/\n+/).filter(p => p.trim()).map(p => `<p>${esc(p)}</p>`).join('');
    const choiceButtons = state.choices.map((c, i) =>
      `<button type="button" class="choice-btn" data-action="choose" data-index="${i}" ${state.loading ? 'disabled' : ''}>${esc(c)}</button>`
    ).join('');

    return `
      <div class="ledger-stack">
        <div class="ledger">
          <div class="narrative entry-enter">${paragraphs}</div>
          ${state.error ? `<div class="error-box">${esc(state.error)}</div><button class="retry-btn" data-action="retry" type="button">Try again</button>` : ''}
          ${state.loading ? renderLoading() : `
            <hr class="fold"/>
            <div class="choices">${choiceButtons}</div>
            <div class="custom-row">
              <input type="text" id="custom-action-input" maxlength="140" placeholder="Or chart your own course..." />
              <button type="button" class="icon-btn" data-action="submit-custom" aria-label="Submit your own action">${ICONS.quill}</button>
            </div>
          `}
          <button type="button" class="abandon-link" data-action="abandon">Abandon this tale</button>
        </div>
      </div>
    `;
  }

  function renderEnd(){
    const fateLabel = state.fate === 'death' ? 'A Fallen Tale' : state.fate === 'victory' ? 'A Tale Well Told' : 'A Tale Concluded';
    return `
      <div class="ledger-stack">
        <div class="ledger">
          <div class="narrative entry-enter">
            <span class="fate-badge">${esc(fateLabel)}</span>
            <p style="font-style:italic;">${esc(state.epilogue)}</p>
          </div>
          <div class="end-stats">
            <span>Entries written: ${state.turn}</span>
            <span>Vitality at close: ${state.vitality}</span>
            <span>Satchel: ${state.satchel.length ? esc(state.satchel.join(', ')) : 'empty'}</span>
          </div>
          <div class="new-tale-row">
            <button type="button" class="seal-btn" data-action="reset">Begin a<br/>New Tale</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderLoading(){
    return `<div class="loading-row"><span>The quill scratches on</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
  }

  /* ---------------- event wiring ---------------- */

  function attachHandlers(){
    const app = document.getElementById('app');

    const apiKeyInput = document.getElementById('apikey-input');
    if(apiKeyInput){
      apiKeyInput.addEventListener('input', e => { state.apiKey = e.target.value; syncBeginState(); });
    }
    const modelInput = document.getElementById('model-input');
    if(modelInput){
      modelInput.addEventListener('input', e => { state.model = e.target.value; });
    }
    const nameInput = document.getElementById('name-input');
    if(nameInput){
      nameInput.addEventListener('input', e => { state.name = e.target.value; syncBeginState(); });
    }
    const seedInput = document.getElementById('seed-input');
    if(seedInput){
      seedInput.addEventListener('input', e => { state.customSeed = e.target.value; });
    }
    const customInput = document.getElementById('custom-action-input');
    if(customInput){
      customInput.addEventListener('keydown', e => { if(e.key === 'Enter') submitCustom(); });
    }

    app.addEventListener('click', onAppClick);
  }

  // avoid stacking duplicate listeners across re-renders
  let clickBound = false;
  function onAppClick(e){
    const el = e.target.closest('[data-action]');
    if(!el) return;
    const action = el.dataset.action;
    if(action === 'select-archetype') selectArchetype(el.dataset.id);
    else if(action === 'begin') beginTale();
    else if(action === 'choose') chooseChoice(Number(el.dataset.index));
    else if(action === 'submit-custom') submitCustom();
    else if(action === 'retry') retry();
    else if(action === 'reset') resetGame();
    else if(action === 'abandon') abandonTale();
  }

  // lightweight re-render of just the begin button state without losing input focus
  function syncBeginState(){
    const btn = document.querySelector('.seal-btn[data-action="begin"]');
    const hint = document.querySelector('.setup-hint');
    if(!btn) return;
    const canBegin = state.name.trim() && state.archetype && state.apiKey.trim() && !state.loading;
    btn.disabled = !canBegin;
    if(hint) hint.textContent = canBegin ? '' : 'Add your Groq API key, name yourself, and choose your path';
  }

  render();
})();
</script>
</body>
</html>
